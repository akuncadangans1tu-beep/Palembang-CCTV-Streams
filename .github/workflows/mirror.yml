name: Mirror
on:
  schedule: [{cron: "30 22 * * *"}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Mirror ke GitLab
        env:
          TOKEN: ${{ secrets.GITLAB_TOKEN }}
          TARGET: ${{ secrets.GITLAB_REPO }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$TARGET" ]; then echo "skip gitlab"; exit 0; fi
          URL=$(echo "$TARGET" | sed "s|https://|https://oauth2:${TOKEN}@|")
          git remote add gl "$URL" 2>/dev/null || git remote set-url gl "$URL"
          git push --force gl HEAD:refs/heads/main
      - name: Mirror ke Codeberg
        env:
          TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          TARGET: ${{ secrets.CODEBERG_REPO }}
          USER: ${{ secrets.CODEBERG_USER }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$TARGET" ]; then echo "skip codeberg"; exit 0; fi
          URL=$(echo "$TARGET" | sed "s|https://|https://${USER}:${TOKEN}@|")
          git remote add cb "$URL" 2>/dev/null || git remote set-url cb "$URL"
          git push --force cb HEAD:refs/heads/main
