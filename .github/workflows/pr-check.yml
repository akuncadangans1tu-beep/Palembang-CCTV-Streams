name: PR Check
on:
  pull_request:
    paths: ["streams.m3u8", "scripts/**"]
permissions: {contents: read, pull-requests: write}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Lint playlist
        id: lint
        run: |
          python scripts/update_streams.py --lint --playlist streams.m3u8 > lint.txt 2>&1 || true
          cat lint.txt
      - name: Dry-run checker
        run: python scripts/update_streams.py --dry-run --limit 5 > dry.txt 2>&1 || true
      - name: Komentar hasil
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const lint=fs.readFileSync('lint.txt','utf8'), dry=fs.readFileSync('dry.txt','utf8');
            const body=`### 🔍 PR Check\n**Lint:**\n\`\`\`\n${lint.slice(0,1500)}\n\`\`\`\n**Dry-run (5 kamera):**\n\`\`\`\n${dry.slice(-1500)}\n\`\`\``;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
