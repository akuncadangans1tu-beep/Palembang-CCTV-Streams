name: Update Thumbnails
on:
  schedule: [{cron: "0 21 * * 0"}]   # Minggu 04:00 WIB
  workflow_dispatch:
permissions: {contents: write}
jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Pastikan ffmpeg terpasang
        run: |
          which ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          ffmpeg -version | head -1
      - name: Generate semua thumbnail (kota + tol)
        run: python scripts/make_thumbs.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs/
          if git diff --cached --quiet; then
            echo "Tidak ada thumbnail baru (cek log [thumb-err] di atas)."
          else
            git commit -m "chore: refresh thumbnails"
            git pull --rebase origin main --no-edit || git rebase --abort
            git push
          fi
