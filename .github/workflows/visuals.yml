name: Visuals
on:
  schedule: [{cron: "0 21 * * 0"}]   # Minggu 04:00 WIB
  workflow_dispatch:
permissions: {contents: write}
jobs:
  vis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install matplotlib pillow
      - name: Visual (map, chart, heatmap, mosaic, banner)
        run: python scripts/make_visuals.py
      - name: Postcard
        run: python scripts/make_visuals.py --postcard
      - name: Snapshot Wayback Machine
        continue-on-error: true
        run: python scripts/archive_wayback.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan visual."
          else
            git commit -m "chore: refresh visuals + postcard"
            git pull --rebase origin main --no-edit || git rebase --abort
            git push
          fi
