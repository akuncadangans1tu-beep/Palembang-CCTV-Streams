name: Visuals
on:
  schedule: [{cron: "0 21 * * 0"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  vis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install matplotlib pillow
      - run: python scripts/make_visuals.py
      - name: Commit & push (dengan pull --rebase)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan visual."
          else
            git pull --rebase origin main --no-edit || git rebase --abort
            git commit -m "chore: refresh visuals"
            git push
          fi
