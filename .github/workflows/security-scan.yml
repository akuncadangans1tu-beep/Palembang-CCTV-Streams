name: Security Scan
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "0 22 * * 1"}]   # Senin 05:00 WIB
  workflow_dispatch:
permissions: {contents: read, security-events: write}
jobs:
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --config p/security-audit --metrics=off --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: semgrep.sarif}
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install bandit
      - run: bandit -r scripts -f sarif -o bandit.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: bandit.sarif}
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        continue-on-error: true
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit
      - run: pip-audit || true
