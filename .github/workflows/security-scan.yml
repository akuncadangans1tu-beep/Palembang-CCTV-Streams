name: Security Scan
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "0 22 * * 1"}]   # Senin 05:00 WIB
  workflow_dispatch:
permissions: {contents: read, security-events: write}
jobs:
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (exclude rule noise urllib-dinamis)
        run: |
          semgrep scan --config p/python --config p/security-audit --metrics=off \
            --exclude-rule python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected \
            --sarif --output semgrep.sarif || true
      - name: Fallback sarif kosong
        run: test -f semgrep.sarif || printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"semgrep","rules":[]}},"results":[]}]}' > semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with: {sarif_file: semgrep.sarif}
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install bandit
      - name: Bandit (exit-zero agar selalu tulis report)
        run: bandit -r scripts -f sarif -o bandit.sarif --exit-zero || true
      - name: Fallback sarif kosong
        run: test -f bandit.sarif || printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"bandit","rules":[]}},"results":[]}]}' > bandit.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with: {sarif_file: bandit.sarif}
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        continue-on-error: true
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install pip-audit
      - run: pip-audit || true
