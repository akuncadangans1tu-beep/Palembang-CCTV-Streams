name: Update CCTV Streams
on:
  schedule: [{cron: "0 20,8,14 * * *"}]
  workflow_dispatch:
permissions: {contents: write, issues: write}
concurrency: {group: update, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {PYTHONUNBUFFERED: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pillow
      - run: python scripts/update_streams.py --playlist streams.m3u8
      - run: python scripts/enrich.py
      - run: python scripts/make_visuals.py --postcard
      - run: python scripts/wa_broadcast.py
      - name: Meta repo (opsional)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_META_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const s = fs.existsSync('status.json') ? JSON.parse(fs.readFileSync('status.json','utf8')).summary : {};
            try {
              await github.rest.repos.update({ owner: context.repo.owner, repo: context.repo.repo,
                description: `📹 ${s.live||0}/${s.total||0} CCTV Palembang live - HLS auto-update harian (unofficial)` });
              await github.rest.repos.replaceAllTopics({ owner: context.repo.owner, repo: context.repo.repo,
                names: ["cctv","palembang","iptv","m3u8","hls","open-data","indonesia","sumatera","webcams","public-cameras"] });
              core.info('Meta repo diperbarui.');
            } catch (e) { core.warning('Meta repo dilewati: ' + e.message); }
      - name: Guard ukuran repo
        run: |
          MB=$(du -sm thumbs data 2>/dev/null | awk '{s+=$1} END {print s+0}')
          echo "thumbs+data = ${MB}MB"
          if [ "$MB" -gt 60 ]; then echo "::warning::${MB}MB > 60MB"; fi
      - name: Issue kamera dihapus
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); if(!fs.existsSync('removed.json'))return;
            const rm=JSON.parse(fs.readFileSync('removed.json','utf8')); if(!rm.length)return;
            const open=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            for(const r of rm){const t=`[kamera-mati] ${r.name}`; if(open.data.some(i=>i.title===t))continue;
              await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:t,body:`Kamera **${r.name}** dihapus otomatis.\nAlasan: ${r.reason}`});}
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Tidak ada perubahan."; else
            git commit -m "chore: auto-update $(date -u '+%F %H:%M')"
            git pull --rebase origin main --no-edit || git rebase --abort
            git push
          fi
