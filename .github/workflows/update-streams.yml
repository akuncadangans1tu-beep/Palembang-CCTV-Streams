name: Update CCTV Streams

on:
  schedule:
    - cron: "0 20 * * *"   # 03:00 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-streams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cek, update & hapus stream
        run: python scripts/update_streams.py --playlist streams.m3u8
      - name: Commit & push kalau ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streams.m3u8 scripts/state.json status.json history.json REPORT.md README.md
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "chore: auto-update streams $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
