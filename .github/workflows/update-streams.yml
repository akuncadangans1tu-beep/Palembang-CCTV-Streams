name: Update CCTV Streams

on:
  schedule:
    - cron: "0 20 * * *"   # 03:00 WIB
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-streams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cek, update & hapus stream
        run: python scripts/update_streams.py --playlist streams.m3u8
      - name: Buka issue untuk kamera yang dihapus
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('removed.json')) return;
            const removed = JSON.parse(fs.readFileSync('removed.json', 'utf8'));
            if (!removed.length) return;
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            for (const r of removed) {
              const title = `[kamera-mati] ${r.name}`;
              if (open.data.some(i => i.title === title)) continue;
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title,
                body: `Kamera **${r.name}** dihapus otomatis oleh checker.\n\nAlasan: ${r.reason}\n\nJika ini keliru atau kamu punya URL pengganti yang stabil, balas issue ini atau kirim PR.`
              });
            }
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streams.m3u8 streams.m3u palembang-kota.m3u8 tol-sumatera.m3u8 scripts/state.json status.json history.json REPORT.md README.md CHANGELOG.md removed.json data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "chore: auto-update streams $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
