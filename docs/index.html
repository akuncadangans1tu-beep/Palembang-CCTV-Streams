<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palembang CCTV — Pantau Langsung</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
 :root{--bg:#0b0f14;--card:#131a22;--line:#1f2a36;--txt:#e6edf3;--mut:#8b98a5;--grn:#22c55e;--red:#ef4444;--acc:#38bdf8}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif}
 header{position:sticky;top:0;z-index:500;background:#0b0f14ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 16px}
 h1{font-size:18px;margin:0 0 8px}
 .stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
 .stats b{color:var(--txt)}
 .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
 input,select,button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
 button{cursor:pointer}button:hover{border-color:var(--acc)}
 .btn-acc{background:var(--acc);color:#04222e;border-color:var(--acc);font-weight:600}
 main{padding:16px;max-width:1400px;margin:0 auto}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
 .thumb{position:relative;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center}
 .thumb video{width:100%;height:100%;object-fit:contain;background:#000}
 .badge{position:absolute;top:8px;left:8px;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
 .live{background:var(--grn);color:#04220e}.off{background:var(--red);color:#2a0606}
 .playbtn{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:#ffffff22;border:1px solid #ffffff55;color:#fff;font-size:20px}
 .meta{padding:10px}.meta .nm{font-size:14px;font-weight:600}.meta .gr{font-size:12px;color:var(--mut);margin-top:2px}.meta .up{font-size:11px;color:var(--mut);margin-top:4px}
 .fallback{display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--mut);font-size:12px;padding:8px;text-align:center}
 .fallback .row{display:flex;gap:6px}.mini{padding:5px 8px;font-size:12px}
 #map{height:70vh;border-radius:12px;border:1px solid var(--line)}
 .hidden{display:none}
 .modal{position:fixed;inset:0;background:#000c;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
 .modal .box{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:900px;width:100%;overflow:hidden}
 .modal video{width:100%;aspect-ratio:16/9;background:#000}
 .modal .bar{display:flex;gap:8px;align-items:center;padding:10px;flex-wrap:wrap}.modal .ttl{font-weight:600;margin-right:auto}
 .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--grn);color:#04220e;padding:10px 16px;border-radius:8px;font-weight:600;z-index:2000;opacity:0;transition:opacity .3s}.toast.show{opacity:1}
 .empty{color:var(--mut);text-align:center;padding:40px}a{color:var(--acc)}
</style>
</head>
<body>
<header>
 <h1>📹 Palembang CCTV — Pantau Langsung</h1>
 <div class="stats" id="stats">Memuat…</div>
 <div class="controls">
   <input id="q" type="search" placeholder="🔍 Cari kamera…" style="flex:1;min-width:160px">
   <select id="grp"><option value="">Semua grup</option></select>
   <button id="viewGal" class="btn-acc">🖼️ Galeri</button>
   <button id="viewMap">🗺️ Peta</button>
   <button id="rnd">🎲 Acak</button>
 </div>
</header>
<main>
 <div id="gallery" class="grid"></div>
 <div id="map" class="hidden"></div>
</main>
<div id="modal" class="modal hidden">
 <div class="box">
   <video id="mvideo" controls playsinline></video>
   <div id="mfallback" class="fallback hidden"></div>
   <div class="bar">
     <span class="ttl" id="mtitle"></span>
     <button class="mini" id="mcopy">📋 Salin URL</button>
     <button class="mini" id="mvlc">▶ Buka di VLC</button>
     <button class="mini" id="mclose">✕ Tutup</button>
   </div>
 </div>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STATUS_URL="https://raw.githubusercontent.com/akuncadangans1tu-beep/Palembang-CCTV-Streams/main/status.json";
let DATA={summary:{},streams:[]},map=null,markers=[],cardHls={},modalHls=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function copyUrl(u){navigator.clipboard.writeText(u).then(()=>toast('URL disalin ✓')).catch(()=>toast('Gagal menyalin'));}
function openVlc(u){copyUrl(u);window.location.href='vlc://'+u;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function filtered(){const q=document.getElementById('q').value.toLowerCase().trim(),g=document.getElementById('grp').value;
 return DATA.streams.filter(s=>(!g||s.group===g)&&(!q||s.name.toLowerCase().includes(q)||s.group.toLowerCase().includes(q)));}
function attachHls(video,url,onFail){
 if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.play().catch(()=>{});return null;}
 if(window.Hls&&Hls.isSupported()){const h=new Hls({liveDurationInfinity:true});h.loadSource(url);h.attachMedia(video);
  h.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
  h.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){try{h.destroy()}catch(_){}onFail&&onFail();}});return h;}
 onFail&&onFail();return null;}
function renderStats(){const s=DATA.summary;document.getElementById('stats').innerHTML=
 `Total <b>${s.total||0}</b> · 🟢 <b>${s.live||0}</b> live · 🔴 <b>${s.offline||0}</b> offline · 🕒 <b>${s.generated_wib||'-'}</b>`;}
function renderGroups(){const sel=document.getElementById('grp'),cur=sel.value;
 const groups=[...new Set(DATA.streams.map(s=>s.group))].sort();
 sel.innerHTML='<option value="">Semua grup</option>'+groups.map(g=>`<option>${esc(g)}</option>`).join('');sel.value=cur;}
function renderGallery(){const list=filtered(),el=document.getElementById('gallery');
 Object.values(cardHls).forEach(h=>{try{h.destroy()}catch(_){}});cardHls={};
 if(!list.length){el.innerHTML='<div class="empty">Tidak ada kamera cocok.</div>';return;}
 el.innerHTML='';
 list.forEach(s=>{const card=document.createElement('div');card.className='card';
  const badge=`<span class="badge ${s.ok?'live':'off'}">${s.ok?'LIVE':'OFFLINE'}</span>`;let thumb;
  if(s.web&&s.ok){thumb=`<div class="thumb"><video muted playsinline></video>${badge}<button class="playbtn">▶</button></div>`;}
  else if(s.web){thumb=`<div class="thumb">${badge}<div class="fallback">Stream sedang offline</div></div>`;}
  else{thumb=`<div class="thumb">${badge}<div class="fallback">📷 Kamera kota (putar di VLC/app IPTV)<div class="row"><button class="mini cpy">📋 Salin</button><button class="mini vlc">▶ VLC</button></div></div></div>`;}
  card.innerHTML=thumb+`<div class="meta"><div class="nm">${esc(s.name)}</div><div class="gr">${esc(s.group)}</div><div class="up">Uptime ${s.uptime_pct??100}%</div></div>`;
  const vid=card.querySelector('video'),pb=card.querySelector('.playbtn');
  if(pb){pb.onclick=()=>{
    if(cardHls[s.key]){try{cardHls[s.key].destroy()}catch(_){}delete cardHls[s.key];vid.removeAttribute('src');vid.load();pb.textContent='▶';return;}
    pb.textContent='⏳';cardHls[s.key]=attachHls(vid,s.url,()=>{pb.textContent='▶';toast('Gagal memutar (CORS/offline)');});
    if(cardHls[s.key])pb.textContent='⏹';vid.onclick=()=>openModal(s);};}
  const cpy=card.querySelector('.cpy');if(cpy)cpy.onclick=()=>copyUrl(s.url);
  const vlc=card.querySelector('.vlc');if(vlc)vlc.onclick=()=>openVlc(s.url);
  el.appendChild(card);});}
function renderMap(){const list=filtered().filter(s=>s.lat!=null&&s.lng!=null);
 if(!map){map=L.map('map').setView([-2.99,104.75],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);}
 markers.forEach(m=>map.removeLayer(m));markers=[];
 list.forEach(s=>{const color=s.ok?'#22c55e':'#ef4444';
  const m=L.circleMarker([s.lat,s.lng],{radius:8,color:color,fillColor:color,fillOpacity:.8,weight:2});
  const btn=s.web?`<button onclick="window.__play('${s.key}')">▶ Putar</button>`:`<button onclick="window.__copy('${s.key}')">📋 Salin URL</button>`;
  m.bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.group)} · ${s.ok?'🟢 Live':'🔴 Offline'}<br>${btn}`);
  m.addTo(map);markers.push(m);});
 setTimeout(()=>map.invalidateSize(),100);}
window.__play=k=>{const s=DATA.streams.find(x=>x.key===k);if(s)openModal(s);};
window.__copy=k=>{const s=DATA.streams.find(x=>x.key===k);if(s)copyUrl(s.url);};
window.__vlc=k=>{const s=DATA.streams.find(x=>x.key===k);if(s)openVlc(s.url);};
function openModal(s){const modal=document.getElementById('modal'),vid=document.getElementById('mvideo'),fb=document.getElementById('mfallback');
 document.getElementById('mtitle').textContent=s.name+' · '+s.group;
 document.getElementById('mcopy').onclick=()=>copyUrl(s.url);document.getElementById('mvlc').onclick=()=>openVlc(s.url);
 if(modalHls){try{modalHls.destroy()}catch(_){}modalHls=null;}vid.removeAttribute('src');vid.load();
 if(s.web&&s.ok){vid.classList.remove('hidden');fb.classList.add('hidden');
  modalHls=attachHls(vid,s.url,()=>{vid.classList.add('hidden');fb.classList.remove('hidden');
   fb.innerHTML='Gagal memutar di browser (CORS/offline).<div class="row"><button class="mini" onclick="window.__copy(\''+s.key+'\')">📋 Salin URL</button></div>';});}
 else{vid.classList.add('hidden');fb.classList.remove('hidden');
  fb.innerHTML=(s.ok?'Kamera ini diputar lewat VLC / app IPTV (tidak support browser).':'Stream sedang offline.')+'<div class="row"><button class="mini" onclick="window.__copy(\''+s.key+'\')">📋 Salin URL</button><button class="mini" onclick="window.__vlc(\''+s.key+'\')">▶ VLC</button></div>';}
 modal.classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');
 if(modalHls){try{modalHls.destroy()}catch(_){}modalHls=null;}const vid=document.getElementById('mvideo');vid.removeAttribute('src');vid.load();}
document.getElementById('mclose').onclick=closeModal;
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
document.getElementById('rnd').onclick=()=>{const live=DATA.streams.filter(s=>s.ok);
 if(!live.length){toast('Tidak ada kamera live');return;}openModal(live[Math.floor(Math.random()*live.length)]);};
document.getElementById('viewGal').onclick=()=>{document.getElementById('gallery').classList.remove('hidden');document.getElementById('map').classList.add('hidden');document.getElementById('viewGal').classList.add('btn-acc');document.getElementById('viewMap').classList.remove('btn-acc');};
document.getElementById('viewMap').onclick=()=>{document.getElementById('gallery').classList.add('hidden');document.getElementById('map').classList.remove('hidden');document.getElementById('viewMap').classList.add('btn-acc');document.getElementById('viewGal').classList.remove('btn-acc');renderMap();};
document.getElementById('q').oninput=()=>{renderGallery();if(!document.getElementById('map').classList.contains('hidden'))renderMap();};
document.getElementById('grp').onchange=()=>{renderGallery();if(!document.getElementById('map').classList.contains('hidden'))renderMap();};
async function load(){try{const r=await fetch(STATUS_URL+'?t='+Date.now());DATA=await r.json();
 renderStats();renderGroups();renderGallery();if(!document.getElementById('map').classList.contains('hidden'))renderMap();}
 catch(e){document.getElementById('stats').textContent='Gagal memuat status.json — jalankan workflow dulu.';}}
load();setInterval(load,300000);
</script>
</body>
</html>
